EnwZ9A1PN5X/K87ooLFvHJfw7gBE7gBD6J+C8zjvOvsXMq4QAAAABJRU5ErkJggg==">
<style>
  :root{
    --bg: #F4F5F2;
    --panel: #FFFFFF;
    --ink: #14242A;
    --ink-soft: #52646B;
    --line: #DDE3E0;
    --navy: #14242A;
    --navy-2: #223840;
    --accent: #3D6B63;
    --recouche: #F4C64F;
    --recouche-ink: #6B4F0A;
    --blanc: #F0A6B4;
    --blanc-ink: #6B1F30;
    --done: #3D8C63;
    --danger: #C1443A;
    --released: #FFD9A8;
    --released-ink: #8A4B06;
    --radius: 14px;
    --mono: 'SFMono-Regular', 'Roboto Mono', Consolas, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- Generic ---- */
  button{font-family:var(--sans);cursor:pointer;border:none;}
  input, select{font-family:var(--sans);}
  .btn{
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
    background:var(--navy);color:#fff;transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{opacity:.88;}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn.danger{background:var(--danger);}
  .btn.ghost{background:transparent;color:var(--ink-soft);padding:8px 12px;}
  .btn.icon-only{padding:9px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;}
  .btn.icon-only:hover{background:var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:700;letter-spacing:.02em;
  }
  .pill.yellow{background:var(--recouche);color:var(--recouche-ink);}
  .pill.pink{background:var(--blanc);color:var(--blanc-ink);}
  .pill.neutral{background:#E7EAE7;color:var(--ink-soft);}
  .pill.done{background:#DCEFE2;color:var(--done);}

  /* ---- Login ---- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{
    background:var(--panel);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;
    box-shadow:0 1px 2px rgba(20,36,42,.04), 0 20px 40px -20px rgba(20,36,42,.18);
    border:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
  .brand-logo{height:64px;width:auto;max-width:100%;}
  .login-card h2{font-size:20px;margin:0 0 6px;}
  .login-card .sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;}
  .role-btn{
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:22px 14px;
    text-align:center;transition:border-color .15s ease, transform .12s ease;
  }
  .role-btn:hover{border-color:var(--navy);transform:translateY(-2px);}
  .role-btn .icon{font-size:26px;display:block;margin-bottom:8px;}
  .role-btn .label{font-weight:700;font-size:14px;}
  .role-btn .desc{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .staff-select-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .staff-select-item{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:12px;background:#fff;transition:border-color .15s ease;
  }
  .staff-select-item:hover{border-color:var(--accent);}
  .staff-avatar{
    width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:20px 0;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);}
  .pin-dot.filled{background:var(--navy);border-color:var(--navy);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-key{
    padding:16px 0;border-radius:12px;background:#F0F1EF;font-size:18px;font-weight:600;
    border:1px solid var(--line);
  }
  .pin-key:hover{background:#E7E9E6;}
  .pin-key.wide{grid-column:span 1;}
  .back-link{font-size:13px;color:var(--ink-soft);margin-bottom:14px;display:inline-flex;align-items:center;gap:4px;}
  .err-msg{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;min-height:16px;}

  /* ---- Header (dashboards) ---- */
  header.top{
    background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
  }
  header.top .who{display:flex;align-items:center;gap:10px;}
  header.top .who .badge{
    width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;
    align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;
  }
  header.top .who .badge.logo-badge{background:#fff;border:1px solid var(--line);padding:4px;box-sizing:border-box;}
  header.top .who .meta{line-height:1.25;}
  header.top .who .meta b{font-size:14px;}
  header.top .who .meta span{font-size:12px;color:var(--ink-soft);}
  header.top .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  main{flex:1;padding:20px 22px 60px;max-width:1180px;width:100%;margin:0 auto;}

  /* ---- Progress ---- */
  .progress-bar{width:100%;height:8px;background:#E7EAE7;border-radius:999px;overflow:hidden;}
  .progress-bar > div{height:100%;background:var(--done);border-radius:999px;transition:width .3s ease;}
  .stats-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;flex:1;min-width:150px;
  }
  .stat-card .num{font-family:var(--mono);font-size:26px;font-weight:700;}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* ---- Building groups ---- */
  .building-group{margin-bottom:26px;}
  .building-title{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
  }
  .building-title .letter{
    width:30px;height:30px;border-radius:8px;background:var(--navy-2);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px;
  }
  .building-title h3{font-size:15px;margin:0;}
  .building-title .count{font-size:12px;color:var(--ink-soft);}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}

  /* ---- Room card (keycard style) ---- */
  .room-card{
    position:relative;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:14px 12px 12px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    min-height:96px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .room-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(20,36,42,.25);}
  .room-card.history-static{cursor:default;}
  .room-card.history-static:hover{transform:none;box-shadow:0 1px 2px rgba(20,36,42,.04);}
  .room-card::before{
    content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    width:26px;height:8px;background:var(--bg);border:1.5px solid var(--line);border-top:none;
    border-radius:0 0 8px 8px;
  }
  .room-card.type-recouche{background:linear-gradient(180deg, #FFF7E3 0%, #fff 46%);border-color:#EBCE8A;}
  .room-card.type-blanc{background:linear-gradient(180deg, #FDEDF0 0%, #fff 46%);border-color:#EAB3BE;}
  .room-card.is-done{background:var(--done);border-color:var(--done);opacity:1;}
  .room-card.is-done .room-num, .room-card.is-done .room-sub{color:#fff;}
  .room-card.is-done .pill{background:rgba(255,255,255,.28);color:#fff;}
  .room-card.is-done .pill.yellow{background:var(--recouche);color:var(--recouche-ink);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
  .room-card.is-done .pill.pink{background:var(--blanc);color:var(--blanc-ink);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
  .room-card.is-done .check-mark.done{background:#fff;border-color:#fff;color:var(--done);}
  .room-card.is-done::before{border-color:var(--done);}
  .room-card.selected{outline:2px solid var(--navy);outline-offset:2px;}
  .room-card.is-released{box-shadow:0 0 0 2px var(--released) inset;}
  .room-card.is-released::after{
    content:'Libérée';position:absolute;top:8px;right:8px;background:var(--released);color:var(--released-ink);
    font-size:9px;font-weight:800;padding:3px 7px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase;
  }
  .linen-flag{
    position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;
    border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2;
  }
  .linen-flag.next-to-tag{right:70px;}
  .room-card.is-linen-collected:not(.is-done){background:linear-gradient(180deg, #E9F3EF 0%, #fff 46%);border-color:var(--accent);}
  .room-card.is-collected{background:var(--accent);border-color:var(--accent);}
  .room-card.is-collected .room-num, .room-card.is-collected .room-sub{color:#fff;}
  .room-card.is-collected .pill{background:rgba(255,255,255,.28);color:#fff;}
  .room-card.is-collected .linen-flag{background:#fff;border-color:#fff;}
  .check-mark.collected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .room-card.is-collected .check-mark.collected{background:#fff;border-color:#fff;color:var(--accent);}
  .room-num{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.02em;}
  .room-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;min-height:14px;}
  .self-assign-btn{
    display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;
    color:var(--navy);background:#fff;border:1px solid var(--navy);border-radius:999px;
    padding:3px 8px;cursor:pointer;
  }
  .self-assign-btn:hover{background:var(--navy);color:#fff;}
  .room-card.is-done .self-assign-btn{color:#fff;border-color:#fff;background:transparent;}
  .room-card.is-done .self-assign-btn:hover{background:#fff;color:var(--navy);}
  .room-card.has-issue{box-shadow:0 0 0 2px #C0392B inset;}
  .issue-pill{
    display:block;margin-top:4px;font-size:10.5px;font-weight:700;color:#C0392B;
    background:#FDECEA;border-radius:8px;padding:3px 7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;
  }
  .tech-issue-btn{
    display:inline-block;margin-top:4px;margin-left:6px;font-size:10.5px;font-weight:700;
    color:#C0392B;background:#fff;border:1px solid #C0392B;border-radius:999px;
    padding:3px 8px;cursor:pointer;
  }
  .tech-issue-btn:hover{background:#C0392B;color:#fff;}
  .tech-issue-btn.remove{background:#C0392B;color:#fff;}
  .tech-issue-btn.remove:hover{background:#fff;color:#C0392B;}
  .room-card.is-done .tech-issue-btn{color:#fff;border-color:#fff;background:transparent;}
  .room-card.is-done .tech-issue-btn:hover{background:#fff;color:#C0392B;}
  .note-toggle{
    display:flex;align-items:center;gap:6px;width:100%;margin-top:6px;padding:6px 8px;
    background:#F2EEE0;border:1px solid #E3D9AE;border-radius:8px;font-size:10.5px;font-weight:700;
    color:#7A5D0A;text-align:left;
  }
  .note-toggle:hover{background:#EBE5D2;}
  .note-toggle .arrow{font-size:9px;transition:transform .15s ease;}
  .note-toggle.open .arrow{transform:rotate(180deg);}
  .note-content{
    margin-top:4px;padding:8px 9px;background:#FFF9EA;border:1px solid #E3D9AE;border-radius:8px;
    font-size:11.5px;color:var(--ink);line-height:1.45;white-space:pre-wrap;word-break:break-word;
  }
  .room-card.is-done .note-toggle, .room-card.is-collected .note-toggle{background:rgba(255,255,255,.85);color:#7A5D0A;}
  .room-card.is-done .note-content, .room-card.is-collected .note-content{background:rgba(255,255,255,.95);}
  .room-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .check-mark{
    width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;
  }
  .check-mark.done{background:var(--done);border-color:var(--done);color:#fff;}
  .room-card .select-box{
    position:absolute;top:8px;left:8px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);
    background:#fff;display:none;align-items:center;justify-content:center;font-size:11px;color:#fff;
  }
  .room-card.selectable .select-box{display:flex;}
  .room-card.selectable .select-box.on{background:var(--navy);border-color:var(--navy);}

  /* ---- Toolbar (admin selection) ---- */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:18px;
  }
  .toolbar .grow{flex:1;min-width:160px;}
  .toolbar select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;}
  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;}
  .card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px;}

  /* ---- Staff management list ---- */
  .staff-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .staff-row:last-child{border-bottom:none;}
  .staff-row .name{font-weight:600;font-size:14px;flex:1;}
  .staff-row .pinlbl{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .inline-form input{padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;}
  .card-panel select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,36,42,.45);display:flex;align-items:flex-start;justify-content:center;
    padding:20px;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .modal{
    background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.35);
    position:relative;margin:20px auto;
  }
  .modal h3{margin:0 0 4px;font-size:17px;}
  .modal .room-tag{font-family:var(--mono);color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .modal .group-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.05em;}
  .modal .type-row{display:flex;gap:8px;}
  .type-opt{flex:1;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700;background:#fff;}
  .type-opt.yellow.active{background:var(--recouche);border-color:#D9AE3C;color:var(--recouche-ink);}
  .type-opt.pink.active{background:var(--blanc);border-color:#DD8C9E;color:var(--blanc-ink);}
  .type-opt.neutral.active{background:#E7EAE7;border-color:#c9cdc9;}
  .modal select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:13px;margin-top:4px;background:#fff;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .info-line{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .filter-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .filter-tab{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);}
  .filter-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block;}

  @media (max-width:560px){
    .room-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
    header.top{padding:12px 14px;}
    main{padding:16px 14px 50px;}
  }
</style>
</head>

<script>
/* =========================================================
   DONNÉES & CONFIGURATION DES CHAMBRES
   ========================================================= */
const BUILDINGS = [
  {letter:'A', from:101, to:119},
  {letter:'B', from:120, to:147},
  {letter:'C', from:148, to:160},
  {letter:'D', from:161, to:168},
  {letter:'E', from:169, to:175},
];

function buildDefaultRooms(){
  const rooms = {};
  BUILDINGS.forEach(b=>{
    for(let n=b.from; n<=b.to; n++){
      rooms[String(n)] = {
        building: b.letter,
        type: null,        // 'recouche' | 'blanc' | null
        status: 'todo',     // 'todo' | 'done'
        assignedTo: [],     // array of staff ids (assignation d'origine faite par la réception/admin)
        doneBy: null,       // staff name (snapshot)
        doneById: null,     // staff id de la personne qui a effectivement fait la chambre
        doneAt: null,       // ISO string
        released: false,    // true = chambre libérée par le client, accessible au ménage
        techIssue: null,     // texte du problème technique signalé, ou null si aucun
        linenCollected: false,   // true = le linge a été collecté (équipe collecte du linge)
        linenCollectedBy: null,  // nom (snapshot) de la personne qui a collecté le linge
        linenCollectedById: null,// id de la personne de l'équipe linge
        linenCollectedAt: null,  // ISO string
        receptionNote: null      // commentaire de la réception pour l'équipe ménage / l'équipe linge
      };
    }
  });
  return rooms;
}

/* Icône "sac à linge" personnalisée (SVG), utilisée pour indiquer le linge collecté */
function linenBagIcon(size){
  size = size || 13;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="vertical-align:-2px;flex-shrink:0;" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 3.4c-.75 0-1.35.6-1.35 1.35 0 .22.05.43.14.62L7.9 8.3C6.2 9.9 5.2 12.1 5.2 14.4c0 4.35 3.05 7.85 6.8 7.85s6.8-3.5 6.8-7.85c0-2.3-1-4.5-2.7-6.1l-2.89-2.93c.09-.19.14-.4.14-.62 0-.75-.6-1.35-1.35-1.35z" fill="var(--accent)"/>
    <path d="M12 5V2.6M9.5 5.9L7.9 3.8M14.5 5.9l1.6-2.1" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}
function timeStr(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function formatDateFr(dateKey){
  const d = new Date(dateKey+'T12:00:00');
  const s = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* =========================================================
   ÉTAT LOCAL
   ========================================================= */
let STATE = null;           // { rooms, staff, adminPin, lastResetISO }
let VIEW = 'start';         // start | admin-pin | staff-pick | staff-pin | admin | staff
let PENDING_STAFF = null;   // staff object mid-login
let PIN_BUFFER = '';
let CURRENT_STAFF = null;   // logged-in staff object
let PENDING_LAUNDRY = null; // équipe collecte du linge — profil en cours de connexion
let CURRENT_LAUNDRY = null; // équipe collecte du linge — profil connecté
let MODAL = null;           // {type:'room', roomNum} | {type:'addStaff'} | null
let SELECT_MODE = false;
let SELECTED_ROOMS = new Set();
let OPEN_NOTES = new Set();  // numéros de chambre dont le commentaire réception est déplié
let ADMIN_FILTER_BUILDING = 'ALL';
let STAFF_FILTER = 'mine';  // mine | all
let EXTRA_MODE = false;      // "en faire plus" — prendre des chambres non attribuées / attribuées à d'autres
let LOADING = true;
let LOAD_ERROR = false;
let AUTH_LOADING = true;    // en attente de la vérification de la session Firebase
let AUTH_USER = null;       // utilisateur Firebase connecté (identifiant de l'établissement)
let AUTH_ERROR = '';        // message d'erreur de connexion à afficher
let AUTH_SUBMITTING = false;
let STATE_LOADED_ONCE = false;

function ensureArray(val){
  if(Array.isArray(val)) return val;
  if(val == null || val === '') return [];
  return [val];
}

function normalizeState(state){
  const defaults = buildDefaultRooms();
  if(!state.rooms) state.rooms = {};
  Object.keys(defaults).forEach(k=>{ if(!state.rooms[k]) state.rooms[k] = defaults[k]; });
  if(!state.staff) state.staff = [];
  if(!state.laundryStaff) state.laundryStaff = [];
  if(!state.adminPin) state.adminPin = '0000';
  if(!state.receptionPin) state.receptionPin = '1111';
  // Compat: assignedTo doit toujours être un tableau (anciennes versions: id unique, chaîne vide, ou null)
  Object.values(state.rooms).forEach(r=>{
    if(r.assignedTo == null || r.assignedTo === ''){
      r.assignedTo = [];
    } else if(!Array.isArray(r.assignedTo)){
      r.assignedTo = [r.assignedTo];
    }
    if(typeof r.released !== 'boolean') r.released = false;
    if(!('doneById' in r)) r.doneById = null;
    if(!('techIssue' in r)) r.techIssue = null;
    if(typeof r.linenCollected !== 'boolean') r.linenCollected = false;
    if(!('linenCollectedBy' in r)) r.linenCollectedBy = null;
    if(!('linenCollectedById' in r)) r.linenCollectedById = null;
    if(!('linenCollectedAt' in r)) r.linenCollectedAt = null;
    if(!('receptionNote' in r)) r.receptionNote = null;
  });
  return state;
}

/* Migration ponctuelle : les anciennes versions stockaient l'historique dans le
   document d'état principal (champ `history`). On le déplace vers la sous-collection
   dédiée puis on le retire du document principal, une seule fois. */
async function migrateLegacyHistory(){
  if(!Array.isArray(STATE.history) || STATE.history.length===0){
    delete STATE.history;
    return;
  }
  try{
    await Promise.all(STATE.history.map(entry=>HISTORY_COL.doc(entry.date).set(entry)));
    await pruneHistory();
  }catch(e){ /* si la migration échoue, on retentera au prochain chargement */ return; }
  delete STATE.history;
  await persist();
}

async function loadState(){
  try{
    const snap = await STATE_DOC.get();
    if(snap.exists && snap.data().payload){
      STATE = normalizeState(JSON.parse(snap.data().payload));
      await migrateLegacyHistory();
    } else {
      // Aucun document distant : il s'agit d'un tout premier démarrage légitime, on initialise.
      STATE = { rooms: buildDefaultRooms(), staff: [], laundryStaff: [], adminPin:'0000', receptionPin:'1111', lastResetISO: new Date().toISOString() };
      await persist();
    }
    LOADING = false;
    LOAD_ERROR = false;
    startRealtimeSync();
  }catch(e){
    // Erreur de lecture (réseau, connexion perdue, etc.) : on ne réinitialise JAMAIS les
    // données existantes. On retente une fois avant d'afficher un écran d'erreur avec
    // possibilité de réessayer, plutôt que d'écraser les codes PIN et les chambres du jour.
    try{
      const snap2 = await STATE_DOC.get();
      if(snap2.exists && snap2.data().payload){
        STATE = normalizeState(JSON.parse(snap2.data().payload));
        LOADING = false;
        LOAD_ERROR = false;
        startRealtimeSync();
        return;
      }
    }catch(e2){ /* toujours en échec, on tombe dans l'écran d'erreur ci-dessous */ }
    LOADING = false;
    LOAD_ERROR = true;
  }
}

async function retryLoadState(){
  LOADING = true;
  LOAD_ERROR = false;
  render();
  await loadState();
  render();
}

async function persist(){
  await STATE_DOC.set({payload: JSON.stringify(STATE), updatedAt: Date.now()});
}

let SAVING = false;
async function saveAndRender(){
  render();
  try{
    SAVING = true;
    await persist();
  }catch(e){
    showToast("Erreur de synchronisation — nouvel essai...");
    try{ await persist(); }catch(e2){ showToast("Impossible d'enregistrer. Vérifiez la connexion."); }
  }finally{
    SAVING = false;
  }
}

/* Synchronisation temps réel entre sessions (remplace l'ancien sondage) */
let POLLING_PAUSED = false;
let REALTIME_STARTED = false;
function startRealtimeSync(){
  if(REALTIME_STARTED) return;
  REALTIME_STARTED = true;
  STATE_DOC.onSnapshot(snap=>{
    if(LOADING || POLLING_PAUSED || MODAL) return;
    if(!snap.exists || !snap.data().payload) return;
    const incoming = snap.data().payload;
    const current = JSON.stringify(STATE);
    if(incoming !== current){
      STATE = normalizeState(JSON.parse(incoming));
      // resync CURRENT_STAFF snapshot if still exists
      if(CURRENT_STAFF){
        const fresh = STATE.staff.find(s=>s.id===CURRENT_STAFF.id);
        if(fresh) CURRENT_STAFF = fresh;
      }
      render();
    }
  }, err=>{ /* silent */ });
}

   ========================================================= */
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* =========================================================
   HELPERS ROOMS
   ========================================================= */
function roomsByBuilding(filterFn){
  const groups = {};
  BUILDINGS.forEach(b=>groups[b.letter] = []);
  Object.keys(STATE.rooms).sort((a,b)=>Number(a)-Number(b)).forEach(num=>{
    const r = STATE.rooms[num];
    if(filterFn && !filterFn(num, r)) return;
    groups[r.building].push(num);
  });
  return groups;
}
function computeStats(rooms){
  const nums = Object.keys(rooms);
  const total = nums.length;
  const done = nums.filter(n=>rooms[n].status==='done').length;
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}
function staffName(id){
  const s = STATE.staff.find(s=>s.id===id);
  return s ? s.name : null;
}

/* =========================================================
   LOGIN — ÉTABLISSEMENT (Firebase Auth)
   Un seul compte email/mot de passe pour tout l'hôtel. Une fois connecté sur
   un appareil, la session reste active (persistance Firebase par défaut) :
   ce n'est donc à saisir qu'une fois par appareil, pas à chaque changement
   de rôle ou de membre du personnel.
   ========================================================= */
function renderAuthGate(app){
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <img class="brand-logo" src="${LOGO_FULL}" alt="Vent d'Eden Park Hotel">
      </div>
      <h2>Connexion de l'établissement</h2>
      <p class="sub">Saisissez les identifiants de l'hôtel pour accéder à l'application.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input type="email" id="auth-email" placeholder="Adresse e-mail" autocomplete="username"
          style="padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;">
        <input type="password" id="auth-password" placeholder="Mot de passe" autocomplete="current-password"
          style="padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;">
        <button class="btn" id="auth-submit-btn" style="margin-top:6px;" ${AUTH_SUBMITTING?'disabled':''}>
          ${AUTH_SUBMITTING?'Connexion…':'Se connecter'}
        </button>
      </div>
      <div class="err-msg">${AUTH_ERROR||''}</div>
    </div>
  </div>`;

  const emailInput = document.getElementById('auth-email');
  const pwInput = document.getElementById('auth-password');

  const submit = async ()=>{
    const email = emailInput.value.trim();
    const pw = pwInput.value;
    if(!email || !pw){ AUTH_ERROR='Veuillez renseigner l\'e-mail et le mot de passe.'; render(); return; }
    AUTH_ERROR=''; AUTH_SUBMITTING=true; render();
    try{
      await auth.signInWithEmailAndPassword(email, pw);
      // onAuthStateChanged prendra le relais (AUTH_USER, chargement des données, render()).
    }catch(e){
      AUTH_SUBMITTING=false;
      AUTH_ERROR = authErrorMessage(e);
      render();
    }
  };

  document.getElementById('auth-submit-btn').onclick = submit;
  [emailInput, pwInput].forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
  emailInput.focus();
}

function authErrorMessage(e){
  const code = e && e.code;
  if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found'){
    return 'Identifiants incorrects.';
  }
  if(code==='auth/invalid-email') return 'Adresse e-mail invalide.';
  if(code==='auth/too-many-requests') return 'Trop de tentatives. Réessayez dans quelques minutes.';
  if(code==='auth/network-request-failed') return 'Connexion réseau indisponible.';
  return 'Connexion impossible. Réessayez.';
}

function renderPinPad(container, {title, sub, backLabel, onBack, onSubmit, expectedLength=4}){
  container.innerHTML = `
    <a class="back-link" id="pin-back">← ${backLabel}</a>
    <h2>${title}</h2>
    <p class="sub">${sub}</p>
    <div class="pin-dots" id="pin-dots"></div>

      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-k="${n}">${n}</button>`).join('')}
      <button class="pin-key" data-k="clear">Effacer</button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key" data-k="back">⌫</button>
    </div>
    <div class="err-msg" id="pin-err"></div>
  `;
  document.getElementById('pin-back').onclick = onBack;
  const dotsEl = document.getElementById('pin-dots');
  function paintDots(){
    dotsEl.innerHTML = Array.from({length:expectedLength}).map((_,i)=>
      `<div class="pin-dot ${i < PIN_BUFFER.length ? 'filled':''}"></div>`).join('');
  }
  paintDots();
  container.querySelectorAll('.pin-key').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.k;
      document.getElementById('pin-err').textContent='';
      if(k==='clear'){ PIN_BUFFER=''; }
      else if(k==='back'){ PIN_BUFFER = PIN_BUFFER.slice(0,-1); }
      else { if(PIN_BUFFER.length < expectedLength) PIN_BUFFER += k; }
      paintDots();
      if(PIN_BUFFER.length===expectedLength){
        onSubmit(PIN_BUFFER, (errMsg)=>{
          document.getElementById('pin-err').textContent = errMsg;
          PIN_BUFFER='';
          paintDots();
        });
      }
    };
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* Nettoie un texte libre saisi par un utilisateur (commentaire réception, problème
   technique) avant stockage : retire les caractères de contrôle invisibles et
   plafonne la longueur. Rappel : le risque réel sur ces champs est l'injection
   HTML/JS (XSS) à l'affichage, pas l'injection SQL (l'app n'utilise aucune base
   SQL) — la protection contre le XSS est assurée à l'affichage par escapeHtml(),
   utilisée systématiquement partout où ces champs sont rendus.  */
function sanitizeText(str, maxLen){
  if(typeof str !== 'string') return '';
  // Retire les caractères de contrôle (hors saut de ligne/tabulation) qui n'ont rien à faire
  // dans un commentaire et peuvent perturber l'affichage ou l'export des données.
  let cleaned = str.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');
  cleaned = cleaned.trim();
  if(maxLen && cleaned.length > maxLen) cleaned = cleaned.slice(0, maxLen);
  return cleaned;
}

/* =========================================================
   CODES PIN — stockage en clair
   Retour en arrière assumé : les codes admin/réception/ménage/linge sont de nouveau
   stockés tels quels dans Firestore (comme le reste de l'état), et affichés en clair
   dans le panneau équipe pour permettre à l'admin de les consulter.
   Compatibilité : si un code a déjà été haché lors d'un test de la version précédente,
   il reste accepté une dernière fois (via son empreinte), puis réenregistré en clair
   automatiquement dès la connexion réussie — un hachage ne pouvant pas être "dé-haché",
   c'est la seule façon de retrouver le code en clair sans le redemander à la personne.
   ========================================================= */
function looksHashed(val){
  return typeof val === 'string' && /^[0-9a-f]{64}$/.test(val);
}
async function sha256Hex(str){
  const data = new TextEncoder().encode(String(str));
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* true si `candidate` correspond à `stored`, que ce dernier soit en clair (cas normal
   désormais) ou encore un ancien hachage résiduel. */
async function pinMatches(candidate, stored){
  if(candidate === stored) return true;
  if(looksHashed(stored)) return (await sha256Hex(candidate)) === stored;
  return false;
}

            <button class="btn secondary" id="bulk-mark-done" style="background:var(--done);color:#fff;border:none;">Marquer prêtes</button>
          </div>
        </div>` : ''}
        <div>
          <button class="btn secondary" id="bulk-reset">Réinitialiser le statut de la sélection</button>
        </div>
      </div>` : ''}

      <div class="card-panel" id="staff-panel" style="display:none;"></div>
      <div class="card-panel" id="laundry-staff-panel" style="display:none;"></div>
      <div class="card-panel" id="history-panel" style="display:none;"></div>

      <div id="rooms-container"></div>
    </main>
  `;

  document.getElementById('logout-btn').onclick = ()=>{ CURRENT_STAFF=null; VIEW='start'; render(); };
  document.getElementById('reset-day-btn').onclick = onResetDay;
  document.getElementById('filter-building').onchange = (e)=>{ ADMIN_FILTER_BUILDING = e.target.value; render(); };
  document.getElementById('toggle-select').onclick = ()=>{ SELECT_MODE=!SELECT_MODE; SELECTED_ROOMS.clear(); render(); };

  const staffPanel = document.getElementById('staff-panel');
  let staffPanelOpen = false;
  document.getElementById('manage-staff-btn').onclick = ()=>{
    staffPanelOpen = !staffPanelOpen;
    staffPanel.style.display = staffPanelOpen ? 'block':'none';
    if(staffPanelOpen) renderStaffPanel(staffPanel, isReception);

  const laundryPanel = document.getElementById('laundry-staff-panel');
  let laundryPanelOpen = false;
  document.getElementById('manage-laundry-btn').onclick = ()=>{
    laundryPanelOpen = !laundryPanelOpen;
    laundryPanel.style.display = laundryPanelOpen ? 'block':'none';
    if(laundryPanelOpen) renderLaundryStaffPanel(laundryPanel, isReception);
  };

  const historyPanel = document.getElementById('history-panel');
  let historyPanelOpen = false;
  document.getElementById('history-btn').onclick = ()=>{
    historyPanelOpen = !historyPanelOpen;
    historyPanel.style.display = historyPanelOpen ? 'block':'none';
    if(historyPanelOpen) renderHistoryPanel(historyPanel, role);
  };

  if(SELECT_MODE){
    document.getElementById('bulk-yellow').onclick = ()=>bulkSetType('recouche');
    document.getElementById('bulk-pink').onclick = ()=>bulkSetType('blanc');
    document.getElementById('bulk-clear-type').onclick = ()=>bulkSetType(null);
    document.getElementById('bulk-reset').onclick = ()=>bulkResetStatus();
    if(isReception){
      document.getElementById('bulk-mark-done').onclick = ()=>bulkMarkDone();
    }
    document.getElementById('bulk-clear-sel').onclick = ()=>{ SELECTED_ROOMS.clear(); render(); };
    document.getElementById('bulk-clear-assign').onclick = ()=>bulkClearAssign();
    document.getElementById('bulk-released-on').onclick = ()=>bulkSetReleased(true);
    document.getElementById('bulk-released-off').onclick = ()=>bulkSetReleased(false);
    document.querySelectorAll('[data-assign-staff]').forEach(btn=>{
      btn.onclick = ()=>bulkToggleAssignStaff(btn.dataset.assignStaff);
    });
  }

  const roomsContainer = document.getElementById('rooms-container');
  renderRoomGroups(roomsContainer, groups, {isAdmin:true});
}

/* =========================================================
   PANNEAUX ÉQUIPES (ménage / collecte du linge)
   Les deux panneaux étaient quasi identiques : ils sont maintenant générés
   par une seule fonction générique, paramétrée par une petite config par équipe.
   ========================================================= */
const STAFF_TEAM_CFG = {
  stateKey: 'staff',
  label: 'Équipe de ménage',
  idPrefix: 'staff',
  listId: 'staff-list',
  showGlobalPins: true,
  receptionInfo: "La réception peut assigner des chambres à l'équipe mais ne peut ni ajouter/retirer de membres, ni voir leurs codes personnels.",
  onRemove(id){
    Object.values(STATE.rooms).forEach(r=>{ r.assignedTo = ensureArray(r.assignedTo).filter(sid=>sid!==id); });
  }
};
const LAUNDRY_TEAM_CFG = {
  stateKey: 'laundryStaff',
  label: 'Équipe collecte du linge',
  idPrefix: 'laundry',
  listId: 'laundry-list',
  showGlobalPins: false,
  receptionInfo: "La réception peut consulter l'équipe collecte du linge mais ne peut ni ajouter/retirer de membres, ni voir leurs codes personnels.",
  onRemove(id){
    Object.values(STATE.rooms).forEach(r=>{
      if(r.linenCollectedById===id){
        r.linenCollected = false;
        r.linenCollectedBy = null;
        r.linenCollectedById = null;
        r.linenCollectedAt = null;
      }
    });
  }
};

function renderTeamPanel(panel, isReception, cfg){
  const members = STATE[cfg.stateKey];
  panel.innerHTML = `
    <div class="section-title">${cfg.label}</div>
    <div id="${cfg.listId}"></div>
    ${isReception ? `
    <div class="info-line">${cfg.receptionInfo}</div>
    ` : `
    <div class="inline-form">
      <input type="text" id="${cfg.idPrefix}-new-name" placeholder="Nom complet" style="flex:1;min-width:140px;">
      <input type="text" id="${cfg.idPrefix}-new-pin" placeholder="Code 4 chiffres" maxlength="4" style="width:120px;">
      <button class="btn" id="${cfg.idPrefix}-add-btn">Ajouter</button>
    </div>
    <div class="info-line">Chaque membre se connecte avec son nom et son code personnel.</div>
    ${cfg.showGlobalPins ? `
    <div class="staff-row">
      <div class="name">Code admin</div>
      <div class="pinlbl">Code : ${looksHashed(STATE.adminPin) ? 'à resaisir (ancien format)' : escapeHtml(STATE.adminPin)}</div>
    </div>
    <div class="staff-row">
      <div class="name">Code réception</div>
      <div class="pinlbl">Code : ${looksHashed(STATE.receptionPin) ? 'à resaisir (ancien format)' : escapeHtml(STATE.receptionPin)}</div>
    </div>
    <div class="inline-form">
      <input type="text" id="new-admin-pin" placeholder="Nouveau code admin" maxlength="4" style="width:160px;" value="">
      <button class="btn secondary" id="change-admin-pin-btn">Modifier le code admin</button>
    </div>
    <div class="inline-form">
      <input type="text" id="new-reception-pin" placeholder="Nouveau code réception" maxlength="4" style="width:160px;" value="">
      <button class="btn secondary" id="change-reception-pin-btn">Modifier le code réception</button>
    </div>
    ` : ''}
    `}
  `;
  const listEl = panel.querySelector(`#${cfg.listId}`);
  function paintList(){
    listEl.innerHTML = members.length===0
      ? `<div style="font-size:13px;color:var(--ink-soft);padding:8px 0;">Aucun membre pour l'instant.</div>`
      : members.map(s=>`
        <div class="staff-row">
          <div class="staff-avatar" style="width:28px;height:28px;font-size:11px;">${initials(s.name)}</div>
          <div class="name">${escapeHtml(s.name)}</div>
          ${isReception ? '' : `<div class="pinlbl">Code : ${escapeHtml(s.pin)}</div>`}
          ${isReception ? '' : `<button class="btn ghost" data-editpin="${s.id}">Modifier le code</button>`}
          ${isReception ? '' : `<button class="btn ghost" data-remove="${s.id}">Retirer</button>`}
        </div>`).join('');
    if(!isReception){
      listEl.querySelectorAll('[data-editpin]').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.editpin;
          const member = members.find(s=>s.id===id);
          if(!member) return;
          const val = window.prompt(`Nouveau code à 4 chiffres pour ${member.name} :`, '');
          if(val === null) return;
          if(!/^\d{4}$/.test(val.trim())){ showToast('Le code doit contenir 4 chiffres.'); return; }
          member.pin = val.trim();
          await saveAndRender();
          showToast(`Code de ${member.name} mis à jour.`);
          renderTeamPanel(panel, isReception, cfg);
        };
      });
      listEl.querySelectorAll('[data-remove]').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.remove;
          STATE[cfg.stateKey] = STATE[cfg.stateKey].filter(s=>s.id!==id);
          cfg.onRemove(id);
          await saveAndRender();
          renderTeamPanel(panel, isReception, cfg);
        };
      });
    }
  }
  paintList();
  if(isReception) return;
  panel.querySelector(`#${cfg.idPrefix}-add-btn`).onclick = async ()=>{
    const nameInput = panel.querySelector(`#${cfg.idPrefix}-new-name`);
    const pinInput = panel.querySelector(`#${cfg.idPrefix}-new-pin`);
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    if(!name){ showToast('Indiquez un nom.'); return; }
    if(!/^\d{4}$/.test(pin)){ showToast('Le code doit contenir 4 chiffres.'); return; }
    STATE[cfg.stateKey].push({id: cfg.idPrefix+'-'+Date.now()+Math.floor(Math.random()*1000), name, pin});
    nameInput.value=''; pinInput.value='';
    await saveAndRender();
    renderTeamPanel(panel, isReception, cfg);
  };
  if(cfg.showGlobalPins){
    panel.querySelector('#change-admin-pin-btn').onclick = async ()=>{
      const val = panel.querySelector('#new-admin-pin').value.trim();
      if(!/^\d{4}$/.test(val)){ showToast('Le code admin doit contenir 4 chiffres.'); return; }
      STATE.adminPin = val;
      await saveAndRender();
      showToast('Code admin mis à jour.');
      renderTeamPanel(panel, isReception, cfg);
    };
    panel.querySelector('#change-reception-pin-btn').onclick = async ()=>{
      const val = panel.querySelector('#new-reception-pin').value.trim();
      if(!/^\d{4}$/.test(val)){ showToast('Le code réception doit contenir 4 chiffres.'); return; }
      STATE.receptionPin = val;
      await saveAndRender();
      showToast('Code réception mis à jour.');
      renderTeamPanel(panel, isReception, cfg);
    };
  }
}

function renderStaffPanel(panel, isReception){ renderTeamPanel(panel, isReception, STAFF_TEAM_CFG); }
function renderLaundryStaffPanel(panel, isReception){ renderTeamPanel(panel, isReception, LAUNDRY_TEAM_CFG); }

/* =========================================================
   HISTORIQUE (espace admin uniquement)
   ========================================================= */
/* Cache mémoire (le temps de la session) pour éviter de retélécharger l'historique
   à chaque ouverture/fermeture du panneau ; invalidé dès qu'un nouveau jour est archivé. */
let HISTORY_CACHE = null;

async function renderHistoryPanel(panel, role){
  const isAdmin = role === 'admin';
  panel.innerHTML = `<div class="section-title">Historique des journées</div><div class="info-line">Chargement de l'historique…</div>`;
  if(!HISTORY_CACHE){
    try{
      const snap = await HISTORY_COL.orderBy('date','desc').limit(30).get();
      HISTORY_CACHE = snap.docs.map(d=>d.data());
    }catch(e){
      console.error('Erreur de chargement de l\'historique :', e);
      const isPermission = e && (e.code === 'permission-denied' || /permission/i.test(e.message||''));
      panel.innerHTML = `
        <div class="section-title">Historique des journées</div>
        <div class="info-line">Impossible de charger l'historique.</div>
        <div class="info-line" style="background:#FDECEA;color:#C0392B;border-radius:8px;padding:8px 10px;">
          ${isPermission
            ? "Accès refusé par Firestore (permission-denied). Vos règles de sécurité Firestore autorisent probablement le document « menage-hotel/etat » mais pas sa sous-collection « historique ». Dans la console Firebase → Firestore Database → Règles, il faut une règle qui couvre aussi les sous-collections, par exemple : <code>match /menage-hotel/{document=**} { allow read, write: if true; }</code> (le <code>{document=**}</code> couvre tous les niveaux, contrairement à <code>{document}</code> qui ne couvre que le document exact)."
            : `Détail technique : ${escapeHtml(e && e.message || 'erreur inconnue')}`}
        </div>
        <button class="btn secondary" id="history-retry-btn" style="margin-top:10px;">Réessayer</button>
      `;
      const retryBtn = panel.querySelector('#history-retry-btn');
      if(retryBtn) retryBtn.onclick = ()=>renderHistoryPanel(panel, role);
      return;
    }
  }
  const list = HISTORY_CACHE;
  if(list.length===0){
    panel.innerHTML = `
      <div class="section-title">Historique des journées</div>
      <div class="info-line">Aucune journée archivée pour l'instant. L'historique se remplit automatiquement à chaque réinitialisation de la journée par la réception (30 derniers jours conservés).</div>
    `;
    return;
  }
  panel.innerHTML = `
    <div class="section-title">Historique des journées</div>
    <div class="inline-form" style="margin-top:0;">
      <select id="history-date-select" style="flex:1;min-width:240px;">
        ${list.map(h=>`<option value="${h.date}">${formatDateFr(h.date)} — ${h.stats.doneRooms}/${h.stats.totalRooms} prêtes</option>`).join('')}
      </select>
    </div>
    <div id="history-day-detail"></div>
    ${isAdmin ? `
    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px;">
      <div class="section-title" style="margin-bottom:6px;">Effacer des journées de l'historique</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;">
        ${list.map(h=>`
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);">
            <input type="checkbox" class="history-del-check" value="${h.date}">
            ${formatDateFr(h.date)} — ${h.stats.doneRooms}/${h.stats.totalRooms} prêtes
          </label>
        `).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px;">
        <span style="font-size:12px;color:var(--ink-soft);" id="history-del-count">0 journée(s) sélectionnée(s)</span>
        <button class="btn danger" id="history-delete-btn" disabled>Effacer la sélection</button>
      </div>
    </div>` : ''}
  `;
  const select = panel.querySelector('#history-date-select');
  const detail = panel.querySelector('#history-day-detail');

  function paintDay(dateKey){
    const entry = list.find(h=>h.date===dateKey);
    if(!entry){ detail.innerHTML = ''; return; }
    const s = entry.stats;
    const pct = s.totalRooms ? Math.round(s.doneRooms/s.totalRooms*100) : 0;
    const groups = {};
    BUILDINGS.forEach(b=>groups[b.letter] = []);
    Object.keys(entry.rooms).sort((a,b)=>Number(a)-Number(b)).forEach(num=>{
      const r = entry.rooms[num];
      if(!groups[r.building]) groups[r.building] = [];
      groups[r.building].push(num);
    });

    detail.innerHTML = `
      <div class="stats-row" style="margin:16px 0;">
        <div class="stat-card"><div class="num">${s.doneRooms}/${s.totalRooms}</div><div class="lbl">Chambres prêtes</div></div>
        <div class="stat-card"><div class="num">${pct}%</div><div class="lbl">Progression</div>
          <div class="progress-bar" style="margin-top:8px;"><div style="width:${pct}%"></div></div>
        </div>
        <div class="stat-card"><div class="num">${s.collectedRooms}</div><div class="lbl">Linge collecté</div></div>
        <div class="stat-card"><div class="num">${s.releasedRooms}</div><div class="lbl">Chambres libérées</div></div>
        <div class="stat-card"><div class="num">${s.issueRooms}</div><div class="lbl">Problèmes signalés</div></div>
      </div>
      <div id="history-rooms"></div>
    `;

    // Réutilise le même rendu de cartes/bâtiments que le tableau de bord (mode 'history' = lecture seule).
    const roomsContainer = detail.querySelector('#history-rooms');
    renderRoomGroups(roomsContainer, groups, {isAdmin:true, mode:'history', roomsSource: entry.rooms});
  }

  paintDay(select.value);
  select.onchange = ()=>paintDay(select.value);

  if(isAdmin){
    const checks = Array.from(panel.querySelectorAll('.history-del-check'));
    const countEl = panel.querySelector('#history-del-count');
    const delBtn = panel.querySelector('#history-delete-btn');
    const updateDelState = ()=>{
      const n = checks.filter(c=>c.checked).length;
      countEl.textContent = `${n} journée(s) sélectionnée(s)`;
      delBtn.disabled = n===0;
    };
    checks.forEach(c=>{ c.onchange = updateDelState; });
    delBtn.onclick = ()=>{
      const dates = checks.filter(c=>c.checked).map(c=>c.value);
      if(dates.length===0) return;
      MODAL = {type:'confirmDeleteHistory', dates};
      POLLING_PAUSED = true;
      renderModal();
    };
  }
}

function onResetDay(){
  MODAL = {type:'confirmReset'};
  POLLING_PAUSED = true;
  renderModal();
}

async function archiveDayIntoHistory(){
  const dateKey = new Date().toISOString().slice(0,10); // AAAA-MM-JJ, jour qui se termine
  const roomsList = Object.values(STATE.rooms);
  const stats = {
    totalRooms: roomsList.length,
    doneRooms: roomsList.filter(r=>r.status==='done').length,
    collectedRooms: roomsList.filter(r=>r.linenCollected).length,
    releasedRooms: roomsList.filter(r=>r.released).length,
    issueRooms: roomsList.filter(r=>r.techIssue).length,
  };
  const entry = {
    date: dateKey,
    savedAt: new Date().toISOString(),
    rooms: JSON.parse(JSON.stringify(STATE.rooms)),
    stats
  };
  try{
    // Un seul petit document écrit par jour (au lieu de réécrire tout l'historique
    // à chaque action), stocké à part du document d'état principal.
    await HISTORY_COL.doc(dateKey).set(entry);
    await pruneHistory();
    HISTORY_CACHE = null; // le nouveau jour archivé doit apparaître si le panneau est rouvert
  }catch(e){
    showToast("La journée est réinitialisée, mais son archivage dans l'historique a échoué (connexion instable).");
  }
}

/* Conserve au maximum les 30 journées les plus récentes : au-delà, les plus anciennes sont supprimées. */
async function pruneHistory(){
  try{
    const snap = await HISTORY_COL.orderBy('date','desc').get();
    const extra = snap.docs.slice(30);
    if(extra.length) await Promise.all(extra.map(d=>d.ref.delete()));
  }catch(e){ /* silencieux : une purge ultérieure rattrapera l'écart */ }
}

async function performResetDay(){
  await archiveDayIntoHistory();
  Object.keys(STATE.rooms).forEach(num=>{
    STATE.rooms[num].status='todo';
    STATE.rooms[num].type=null;
    STATE.rooms[num].assignedTo=[];
    STATE.rooms[num].doneBy=null;
    STATE.rooms[num].doneById=null;
    STATE.rooms[num].doneAt=null;
    STATE.rooms[num].released=false;
    STATE.rooms[num].linenCollected=false;
    STATE.rooms[num].linenCollectedBy=null;
    STATE.rooms[num].linenCollectedById=null;
    STATE.rooms[num].linenCollectedAt=null;
    STATE.rooms[num].receptionNote=null;
  });
  STATE.lastResetISO = new Date().toISOString();
  SELECTED_ROOMS.clear();
  await saveAndRender();
  showToast('Journée réinitialisée et archivée dans l\'historique.');
}

async function bulkSetType(type){
  SELECTED_ROOMS.forEach(num=>{ STATE.rooms[num].type = type; });
  await saveAndRender();
}
async function bulkToggleAssignStaff(staffId){
  // Si toutes les chambres sélectionnées ont déjà cette personne, on la retire de toutes ; sinon on l'ajoute à toutes.
  const rooms = Array.from(SELECTED_ROOMS).map(num=>STATE.rooms[num]);
  const allHaveIt = rooms.every(r=>ensureArray(r.assignedTo).includes(staffId));
  rooms.forEach(r=>{
    r.assignedTo = ensureArray(r.assignedTo);
    if(allHaveIt){
      r.assignedTo = r.assignedTo.filter(id=>id!==staffId);
    } else if(!r.assignedTo.includes(staffId)){
      r.assignedTo.push(staffId);
    }
  });
  await saveAndRender();
  showToast(allHaveIt ? 'Retirée de la sélection.' : 'Assignée à la sélection.');
}
async function bulkClearAssign(){
  SELECTED_ROOMS.forEach(num=>{ STATE.rooms[num].assignedTo = []; });
  await saveAndRender();
}
async function bulkSetReleased(val){
  SELECTED_ROOMS.forEach(num=>{ STATE.rooms[num].released = val; });
  await saveAndRender();
  showToast(val ? 'Chambre(s) marquée(s) libérée(s).' : 'Chambre(s) marquée(s) non libérée(s).');
}
async function bulkResetStatus(){
  SELECTED_ROOMS.forEach(num=>{
    STATE.rooms[num].status='todo';
    STATE.rooms[num].doneBy=null;
    STATE.rooms[num].doneAt=null;
  });
  await saveAndRender();
}
async function bulkMarkDone(){
  SELECTED_ROOMS.forEach(num=>{
    const r = STATE.rooms[num];
    r.status='done';
    r.doneBy = 'Réception';
    r.doneById = null;
    r.doneAt = new Date().toISOString();
  });
  await saveAndRender();
  showToast('Chambre(s) marquée(s) prête(s).');
}

/* =========================================================
   ROOM GROUPS + CARDS (shared between admin & staff)
   ========================================================= */
function renderRoomGroups(container, groups, {isAdmin, mode, roomsSource}){
  mode = mode || (isAdmin ? 'admin' : 'staff');
  const historic = mode === 'history';
  const rooms = roomsSource || STATE.rooms;
  const parts = [];
  BUILDINGS.forEach(b=>{
    const nums = groups[b.letter];
    if(!nums || nums.length===0) return;
    const doneCount = nums.filter(n=>rooms[n].status==='done').length;
    parts.push(`
      <div class="building-group">
        <div class="building-title">
          <div class="letter">${b.letter}</div>
          <h3>Bâtiment ${b.letter}</h3>
          <span class="count">${b.from}–${b.to} · ${doneCount}/${nums.length} prêtes</span>
        </div>
        <div class="room-grid" data-building="${b.letter}"></div>
      </div>
    `);
  });
  container.innerHTML = parts.join('') || `<div style="color:var(--ink-soft);font-size:14px;">Aucune chambre à afficher.</div>`;

  BUILDINGS.forEach(b=>{
    const grid = container.querySelector(`.room-grid[data-building="${b.letter}"]`);
    if(!grid) return;
    const nums = groups[b.letter];
    grid.innerHTML = nums.map(num=>roomCardHtml(num, isAdmin, mode, rooms[num])).join('');
    if(historic) return; // cartes d'historique en lecture seule : pas de gestionnaires de clic
    nums.forEach(num=>{
      const card = grid.querySelector(`[data-room="${num}"]`);
      card.onclick = (e)=>{
        if(SELECT_MODE){
          if(SELECTED_ROOMS.has(num)) SELECTED_ROOMS.delete(num); else SELECTED_ROOMS.add(num);
          render();
          return;
        }
        if(mode==='linen'){ onLaundryRoomClick(num); return; }
        if(isAdmin){ openRoomModal(num); return; }
        onStaffRoomClick(num);
      };
      const selfBtn = card.querySelector('.self-assign-btn');
      if(selfBtn){
        selfBtn.onclick = (e)=>{
          e.stopPropagation();
          onStaffSelfAssign(num);
        };
      }
      const reportBtn = card.querySelector('[data-issue-report]');
      if(reportBtn){
        reportBtn.onclick = (e)=>{
          e.stopPropagation();
          onReportTechIssue(num);
        };
      }
      const removeIssueBtn = card.querySelector('[data-issue-remove]');
      if(removeIssueBtn){
        removeIssueBtn.onclick = (e)=>{
          e.stopPropagation();
          onRemoveTechIssue(num);
        };
      }
      const noteToggleBtn = card.querySelector('[data-note-toggle]');
      if(noteToggleBtn){
        noteToggleBtn.onclick = (e)=>{
          e.stopPropagation();
          if(OPEN_NOTES.has(num)) OPEN_NOTES.delete(num); else OPEN_NOTES.add(num);
          render();
        };
      }
    });
  });
}

function roomCardHtml(num, isAdmin, mode, roomOverride){
  mode = mode || (isAdmin ? 'admin' : 'staff');
  const historic = mode === 'history';
  const r = roomOverride || STATE.rooms[num];
  const typeClass = r.type==='recouche' ? 'type-recouche' : r.type==='blanc' ? 'type-blanc' : '';
  const doneClass = (mode!=='linen' && r.status==='done') ? 'is-done' : '';
  const collectedClass = mode==='linen' ? (r.linenCollected ? 'is-collected' : '') : (r.linenCollected ? 'is-linen-collected' : '');
  const releasedClass = (r.released && r.status!=='done') ? 'is-released' : '';
  const issueClass = r.techIssue ? 'has-issue' : '';
  const selClass = (!historic && SELECT_MODE) ? 'selectable' : '';
  const selectedOn = (!historic && SELECTED_ROOMS.has(num)) ? 'on':'';
  const assignedNames = ensureArray(r.assignedTo).map(id=>staffName(id)).filter(Boolean);
  const linenFlag = r.linenCollected
    ? `<span class="linen-flag${releasedClass ? ' next-to-tag' : ''}" title="Linge collecté par ${escapeHtml(r.linenCollectedBy||'')}${r.linenCollectedAt ? ' · '+timeStr(r.linenCollectedAt) : ''}">${linenBagIcon(13)}</span>`
    : '';
  let sub = '';
  if(mode==='linen'){
    sub = r.linenCollected
      ? `${linenBagIcon(12)} Vidée par ${escapeHtml(r.linenCollectedBy||'')} · ${timeStr(r.linenCollectedAt)}`
      : 'Linge à collecter';
  } else if(r.status==='done'){
    sub = `✓ ${escapeHtml(r.doneBy||'')} · ${timeStr(r.doneAt)}`;
  } else if(assignedNames.length){
    sub = `→ ${escapeHtml(assignedNames.join(', '))}`;
  } else {
    sub = 'Non assignée';
  }
  let selfAssignBtn = '';
  if(!historic && mode==='staff' && !SELECT_MODE && CURRENT_STAFF){
    const alreadyMine = ensureArray(r.assignedTo).includes(CURRENT_STAFF.id);
    if(!alreadyMine && assignedNames.length){
      selfAssignBtn = `<button type="button" class="self-assign-btn" data-selfassign="${num}">Me l'attribuer</button>`;
    }
  }
  let issueBtn = '';
  if(!historic && mode==='staff' && !SELECT_MODE){
    issueBtn = r.techIssue
      ? `<button type="button" class="tech-issue-btn remove" data-issue-remove="${num}">⚠ Retirer le problème technique</button>`
      : `<button type="button" class="tech-issue-btn" data-issue-report="${num}">Signaler un problème technique</button>`;
  }
  let noteDropdown = '';
  if(r.receptionNote){
    if(historic){
      // Historique : lecture seule, le commentaire est toujours affiché en entier (pas de repli).
      noteDropdown = `<div class="note-content" style="display:block;margin-top:6px;">${escapeHtml(r.receptionNote)}</div>`;
    } else {
      const isOpen = OPEN_NOTES.has(num);
      noteDropdown = `
        <button type="button" class="note-toggle ${isOpen?'open':''}" data-note-toggle="${num}">
          <span class="arrow">▼</span> Commentaire de la réception
        </button>
        ${isOpen ? `<div class="note-content">${escapeHtml(r.receptionNote)}</div>` : ''}
      `;
    }
  }
  const checkMarkDone = mode==='linen' ? r.linenCollected : r.status==='done';
  const checkMarkClass = mode==='linen' ? (r.linenCollected ? 'collected' : '') : (r.status==='done' ? 'done' : '');
  const cardStateClasses = historic ? 'history-static' : `${selClass} ${SELECTED_ROOMS.has(num)?'selected':''}`;
  return `
    <div class="room-card ${typeClass} ${doneClass} ${collectedClass} ${releasedClass} ${issueClass} ${cardStateClasses}" data-room="${num}">
      ${!historic ? `<div class="select-box ${selectedOn}">✓</div>` : ''}
      ${mode!=='linen' ? linenFlag : ''}
      <div>
        <div class="room-num">${num}</div>
        <div class="room-sub">${sub}</div>
        ${(mode!=='linen' && r.techIssue) ? `<div class="issue-pill" title="${escapeHtml(r.techIssue)}">⚠ ${escapeHtml(r.techIssue)}</div>` : ''}
        ${selfAssignBtn}
        ${issueBtn}
        ${noteDropdown}
      </div>
      <div class="room-foot">
        ${r.type==='recouche' ? '<span class="pill yellow">Recouche</span>' : r.type==='blanc' ? '<span class="pill pink">À blanc</span>' : '<span class="pill neutral">—</span>'}
        <div class="check-mark ${checkMarkClass}">${checkMarkDone?'✓':''}</div>
      </div>
    </div>
  `;
}

/* =========================================================
   ROOM MODAL (admin edit)
   ========================================================= */
function openRoomModal(num){
  MODAL = {type:'room', num};
  POLLING_PAUSED = true;
  renderModal();
}
function closeModal(){
  MODAL = null;
  POLLING_PAUSED = false;
  render();
  renderModal(); // retire l'overlay du DOM (render() ne touche pas à #modal-overlay)
}

function renderModal(){
  let existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  if(!MODAL) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modal-overlay';

  if(MODAL.type==='confirmReset'){
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="modal-close">✕</button>
        <h3>Réinitialiser la journée ?</h3>
        <p style="font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:10px;">
          Toutes les chambres repasseront à « à faire ». Les types (recouche / à blanc) et les assignations seront effacés. Cette action est irréversible.
        </p>
        <div class="modal-actions">
          <button class="btn secondary" id="modal-cancel">Annuler</button>
          <button class="btn danger" id="modal-confirm-reset">Réinitialiser</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('modal-close').onclick = closeModal;
    document.getElementById('modal-cancel').onclick = closeModal;
    document.getElementById('modal-confirm-reset').onclick = async ()=>{
      await performResetDay();
      closeModal();
    };
  } else if(MODAL.type==='room'){
    const num = MODAL.num;
    const r = STATE.rooms[num];
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="modal-close">✕</button>
        <h3>Chambre ${num}</h3>
        <div class="room-tag">Bâtiment ${r.building}</div>

        <div class="group-label">Type de nettoyage</div>
        <div class="type-row">
          <button class="type-opt yellow ${r.type==='recouche'?'active':''}" data-type="recouche">Recouche</button>
          <button class="type-opt pink ${r.type==='blanc'?'active':''}" data-type="blanc">À blanc</button>
          <button class="type-opt neutral ${!r.type?'active':''}" data-type="">Aucun</button>
        </div>

        <div class="group-label">Assignée à (plusieurs personnes possibles)</div>
        <div class="type-row" style="flex-wrap:wrap;">
          ${STATE.staff.length ? STATE.staff.map(s=>`<button class="type-opt neutral ${ensureArray(r.assignedTo).includes(s.id)?'active':''}" data-assign="${s.id}" style="flex:none;padding:8px 12px;">${escapeHtml(s.name)}</button>`).join('') : "<span style=\"font-size:13px;color:var(--ink-soft);\">Aucun membre d'équipe créé.</span>"}
        </div>
        <div class="info-line">La première personne assignée qui coche la chambre la marque comme prête.</div>

        <div class="group-label">Statut</div>
        <div class="type-row">
          <button class="type-opt neutral ${r.status==='todo'?'active':''}" data-status="todo">À faire</button>
          <button class="type-opt neutral ${r.status==='done'?'active':''}" data-status="done" style="${r.status==='done'?'background:#DCEFE2;border-color:#3D8C63;color:#256b41;':''}">Prête</button>
        </div>
        ${r.status==='done' ? `<div class="info-line">Faite par ${escapeHtml(r.doneBy||'')} à ${timeStr(r.doneAt)}</div>` : ''}

        <div class="group-label">Accès chambre</div>
        <div class="type-row">
          <button class="type-opt neutral ${!r.released?'active':''}" data-released="0">Non libérée</button>
          <button class="type-opt neutral ${r.released?'active':''}" data-released="1" style="${r.released?'background:var(--released);border-color:#E0A233;color:var(--released-ink);':''}">Libérée</button>
        </div>
        <div class="info-line">Cochez « Libérée » dès que le client est parti et que la chambre est accessible : elle apparaît en orange clair pour l'équipe de ménage.</div>

        <div class="group-label">Problème technique</div>
        ${r.techIssue ? `
        <div class="info-line" style="background:#FDECEA;color:#C0392B;border-radius:8px;padding:8px 10px;font-weight:600;">⚠ ${escapeHtml(r.techIssue)}</div>
        <div class="modal-actions" style="margin-top:8px;">
          <button class="btn secondary" id="edit-issue-btn">Modifier</button>
          <button class="btn danger" id="remove-issue-btn">Retirer le problème technique</button>
        </div>
        ` : `
        <div class="modal-actions" style="margin-top:4px;">
          <button class="btn secondary" id="report-issue-btn">Signaler un problème technique</button>
        </div>
        `}

        <div class="group-label">Commentaire pour les équipes (ménage / linge)</div>
        <textarea id="reception-note-input" rows="3" maxlength="1000" placeholder="Ex : Ne pas déranger avant 11h, client encore présent." style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-family:inherit;resize:vertical;">${escapeHtml(r.receptionNote||'')}</textarea>
        <div class="info-line">Ce commentaire apparaît dans un déroulant sous la chambre, visible par l'équipe ménage et l'équipe collecte du linge.</div>
        <div class="modal-actions" style="margin-top:8px;">
          <button class="btn secondary" id="save-note-btn">Enregistrer le commentaire</button>
          ${r.receptionNote ? '<button class="btn danger" id="clear-note-btn">Supprimer le commentaire</button>' : ''}
        </div>

        <div class="modal-actions">
          <button class="btn secondary" id="modal-cancel">Fermer</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('modal-close').onclick = closeModal;
    document.getElementById('modal-cancel').onclick = closeModal;
    const reportBtn = document.getElementById('report-issue-btn');
    if(reportBtn){
      reportBtn.onclick = async ()=>{
        const desc = window.prompt(`Décrivez le problème technique de la chambre ${num} :`, '');
        if(desc === null) return;
        const trimmed = sanitizeText(desc, 500);
        if(!trimmed) return;
        r.techIssue = trimmed;
        await saveAndRender();
        renderModal();
      };
    }
    const editBtn = document.getElementById('edit-issue-btn');
    if(editBtn){
      editBtn.onclick = async ()=>{
        const desc = window.prompt(`Modifier le problème technique de la chambre ${num} :`, r.techIssue || '');
        if(desc === null) return;
        const trimmed = sanitizeText(desc, 500);
        r.techIssue = trimmed || null;
        await saveAndRender();
        renderModal();
      };
    }
    const removeBtn = document.getElementById('remove-issue-btn');
    if(removeBtn){
      removeBtn.onclick = async ()=>{
        r.techIssue = null;
        await saveAndRender();
        renderModal();
      };
    }
    document.getElementById('save-note-btn').onclick = async ()=>{
      const val = sanitizeText(document.getElementById('reception-note-input').value, 1000);
      r.receptionNote = val || null;
      await saveAndRender();
      showToast('Commentaire enregistré.');
      renderModal();
    };
    const clearNoteBtn = document.getElementById('clear-note-btn');
    if(clearNoteBtn){
      clearNoteBtn.onclick = async ()=>{
        r.receptionNote = null;
        await saveAndRender();
        showToast('Commentaire supprimé.');
        renderModal();
      };
    }
    overlay.querySelectorAll('[data-type]').forEach(btn=>{
      btn.onclick = async ()=>{
        r.type = btn.dataset.type || null;
        await saveAndRender();
        renderModal();
      };
    });
    overlay.querySelectorAll('[data-assign]').forEach(btn=>{
      btn.onclick = async ()=>{
        const sid = btn.dataset.assign;
        r.assignedTo = ensureArray(r.assignedTo);
        if(r.assignedTo.includes(sid)) r.assignedTo = r.assignedTo.filter(id=>id!==sid);
        else r.assignedTo.push(sid);
        await saveAndRender();
        renderModal();
      };
    });
    overlay.querySelectorAll('[data-released]').forEach(btn=>{
      btn.onclick = async ()=>{
        r.released = btn.dataset.released === '1';
        await saveAndRender();
        renderModal();
      };
    });
    overlay.querySelectorAll('[data-status]').forEach(btn=>{
      btn.onclick = async ()=>{
        const st = btn.dataset.status;
        r.status = st;
        if(st==='done'){
          r.doneBy = 'Admin';
          r.doneById = null;
          r.doneAt = new Date().toISOString();
        } else {
          r.doneBy = null; r.doneById = null; r.doneAt = null;
        }
        await saveAndRender();
        renderModal();
      };
    });
  } else if(MODAL.type==='confirmDeleteHistory'){
    const dates = MODAL.dates.slice().sort();
    const n = dates.length;
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="modal-close">✕</button>
        <h3>Effacer ${n>1 ? `${n} journées` : 'cette journée'} de l'historique ?</h3>
        <p style="font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:10px;">
          ${n>1 ? 'Ces journées seront définitivement supprimées de l\'historique' : 'Cette journée sera définitivement supprimée de l\'historique'} : ${dates.map(formatDateFr).join(', ')}. Cette action est irréversible.
        </p>
        <div class="modal-actions">
          <button class="btn secondary" id="modal-cancel">Annuler</button>
          <button class="btn danger" id="modal-confirm-delete-history">Effacer</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('modal-close').onclick = closeModal;
    document.getElementById('modal-cancel').onclick = closeModal;
    document.getElementById('modal-confirm-delete-history').onclick = async ()=>{
      const confirmBtn = document.getElementById('modal-confirm-delete-history');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Suppression…';
      try{
        await Promise.all(MODAL.dates.map(d=>HISTORY_COL.doc(d).delete()));
        HISTORY_CACHE = null;
        showToast(n>1 ? 'Journées supprimées de l\'historique.' : 'Journée supprimée de l\'historique.');
      }catch(e){
        showToast("Erreur lors de la suppression. Vérifiez la connexion et réessayez.");
      }
      closeModal();
    };
  }
}

      <label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-soft);margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;">

  renderRoomGroups(document.getElementById('rooms-container'), groups, {isAdmin:false, mode:'linen'});

async function onStaffRoomClick(num){
  const r = STATE.rooms[num];
  r.assignedTo = ensureArray(r.assignedTo);
  const iAmAssigned = r.assignedTo.includes(CURRENT_STAFF.id);

  if(r.status==='done'){
    const iDidIt = r.doneById === CURRENT_STAFF.id;
    // Peut annuler : la personne assignée à l'origine, celle qui l'a réellement faite, ou "En faire plus".
    if(!iAmAssigned && !iDidIt && !EXTRA_MODE){
      showToast('Cette chambre est déjà prête.');
      return;
    }
    r.status='todo'; r.doneBy=null; r.doneById=null; r.doneAt=null;
    await saveAndRender();
    return;
  }

  // Statut "à faire"
  if(!iAmAssigned && r.assignedTo.length && !EXTRA_MODE){
    showToast(`Chambre assignée à ${r.assignedTo.map(id=>staffName(id)).join(', ')}.`);
    return;
  }
  // On ne modifie jamais l'assignation d'origine (faite par la réception/admin) : que la chambre soit
  // assignée à moi, non assignée, ou prise en "En faire plus" pour une autre personne, seul le nom de
  // la personne qui l'a réellement faite est enregistré. Si elle décoche par erreur, tout redevient
  // exactement comme avant : la chambre retrouve son assignation (ou son absence d'assignation) d'origine.
  r.status='done';
  r.doneBy = CURRENT_STAFF.name;
  r.doneById = CURRENT_STAFF.id;
  r.doneAt = new Date().toISOString();
  if(!iAmAssigned && r.assignedTo.length){
    showToast(`Chambre marquée prête par vous (assignée à ${r.assignedTo.map(id=>staffName(id)).join(', ')}).`);
  }
  await saveAndRender();
}

async function onStaffSelfAssign(num){
  const r = STATE.rooms[num];
  r.assignedTo = ensureArray(r.assignedTo);
  const currentNames = r.assignedTo.map(id=>staffName(id)).filter(Boolean).join(', ');
  const ok = window.confirm(
    `La chambre ${num} est actuellement assignée à ${currentNames || 'personne'}.\n\nVoulez-vous vous l'attribuer à sa place ?`
  );
  if(!ok) return;
  r.assignedTo = [CURRENT_STAFF.id];
  await saveAndRender();
  showToast(`Chambre ${num} attribuée à vous.`);
}

async function onLaundryRoomClick(num){
  const r = STATE.rooms[num];
  if(r.linenCollected){
    r.linenCollected = false;
    r.linenCollectedBy = null;
    r.linenCollectedById = null;
    r.linenCollectedAt = null;
  } else {
    r.linenCollected = true;
    r.linenCollectedBy = CURRENT_LAUNDRY.name;
    r.linenCollectedById = CURRENT_LAUNDRY.id;
    r.linenCollectedAt = new Date().toISOString();
  }
  await saveAndRender();
}

async function onChangeOwnLaundryPin(){
  const currentInput = window.prompt('Pour confirmer, saisissez votre code actuel :', '');
  if(currentInput === null) return;
  const currentOk = await pinMatches(currentInput.trim(), CURRENT_LAUNDRY.pin);
  if(!currentOk){ showToast('Code actuel incorrect.'); return; }
  const newPin = window.prompt('Nouveau code à 4 chiffres :', '');
  if(newPin === null) return;
  if(!/^\d{4}$/.test(newPin.trim())){ showToast('Le code doit contenir 4 chiffres.'); return; }
  const confirmPin = window.prompt('Confirmez le nouveau code :', '');
  if(confirmPin === null) return;
  if(confirmPin.trim() !== newPin.trim()){ showToast('Les deux codes ne correspondent pas.'); return; }
  const member = STATE.laundryStaff.find(s=>s.id===CURRENT_LAUNDRY.id);
  if(member) member.pin = newPin.trim();
  CURRENT_LAUNDRY.pin = newPin.trim();
  await saveAndRender();
  showToast('Votre code a été mis à jour.');
}

async function onReportTechIssue(num){
  const current = STATE.rooms[num].techIssue || '';
  const desc = window.prompt(`Décrivez le problème technique de la chambre ${num} :`, current);
  if(desc === null) return; // annulé
  const trimmed = sanitizeText(desc, 500);
  if(!trimmed){ showToast('Aucun problème enregistré (description vide).'); return; }
  STATE.rooms[num].techIssue = trimmed;
  await saveAndRender();
  showToast(`Problème technique signalé pour la chambre ${num}.`);
}
async function onRemoveTechIssue(num){
  STATE.rooms[num].techIssue = null;
  await saveAndRender();
  showToast(`Problème technique retiré pour la chambre ${num}.`);
}

/* =========================================================
   BOOT
   ========================================================= */
auth.onAuthStateChanged(async (user)=>{
  AUTH_USER = user;
  AUTH_LOADING = false;
  AUTH_SUBMITTING = false;
  if(user && !STATE_LOADED_ONCE){
    STATE_LOADED_ONCE = true;
    LOADING = true;
    render();
    await loadState();
  }
  if(!user){
    // Session terminée (ou jamais commencée) : on repart d'un état propre pour le prochain login.
    STATE_LOADED_ONCE = false;
    LOADING = true;
    REALTIME_STARTED = false;
  }
  render();
});
